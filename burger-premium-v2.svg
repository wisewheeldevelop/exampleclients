<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Premium animated burger mascot V2</title>
<desc id="desc">A fully vector, animated premium burger mascot with refined materials, lighting and facial expression.</desc>

<defs>
  <!-- Main material gradients -->
  <linearGradient id="bunTop" x1="0.12" y1="0.05" x2="0.88" y2="0.95">
    <stop offset="0" stop-color="#FFE5A2"/>
    <stop offset="0.28" stop-color="#F9C05F"/>
    <stop offset="0.62" stop-color="#E88A24"/>
    <stop offset="1" stop-color="#9C3F0D"/>
  </linearGradient>
  <linearGradient id="bunBottom" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#FFD98A"/>
    <stop offset="0.45" stop-color="#EBA044"/>
    <stop offset="1" stop-color="#9A3C0D"/>
  </linearGradient>
  <linearGradient id="bunRim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFD47E"/>
    <stop offset="0.55" stop-color="#D8731B"/>
    <stop offset="1" stop-color="#7E2A08"/>
  </linearGradient>
  <linearGradient id="cheese" x1="0.08" y1="0" x2="0.92" y2="1">
    <stop offset="0" stop-color="#FFF28F"/>
    <stop offset="0.35" stop-color="#FFD23F"/>
    <stop offset="0.72" stop-color="#F3A117"/>
    <stop offset="1" stop-color="#D86808"/>
  </linearGradient>
  <linearGradient id="patty" x1="0.12" y1="0" x2="0.88" y2="1">
    <stop offset="0" stop-color="#8A422C"/>
    <stop offset="0.42" stop-color="#4F2118"/>
    <stop offset="0.8" stop-color="#27100D"/>
    <stop offset="1" stop-color="#110706"/>
  </linearGradient>
  <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF8C72"/>
    <stop offset="0.45" stop-color="#EA4335"/>
    <stop offset="1" stop-color="#98151B"/>
  </linearGradient>
  <linearGradient id="lettuce" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#C8F879"/>
    <stop offset="0.38" stop-color="#6BCB4C"/>
    <stop offset="0.75" stop-color="#2B8D3E"/>
    <stop offset="1" stop-color="#15502B"/>
  </linearGradient>
  <radialGradient id="eye" cx="30%" cy="22%" r="78%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.12" stop-color="#A8E6FF"/>
    <stop offset="0.30" stop-color="#2B5970"/>
    <stop offset="0.62" stop-color="#091820"/>
    <stop offset="1" stop-color="#010609"/>
  </radialGradient>
  <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2B0D10"/>
    <stop offset="1" stop-color="#0A0203"/>
  </linearGradient>
  <linearGradient id="tongue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FF9DA4"/>
    <stop offset="1" stop-color="#E66A77"/>
  </linearGradient>

  <!-- Lighting -->
  <linearGradient id="specular" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".86"/>
    <stop offset=".38" stop-color="#FFFFFF" stop-opacity=".25"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="warmGlow" cx="50%" cy="40%" r="60%">
    <stop offset="0" stop-color="#FFD77E" stop-opacity=".5"/>
    <stop offset="1" stop-color="#FFD77E" stop-opacity="0"/>
  </radialGradient>

  <!-- Filters -->
  <filter id="heroShadow" x="-35%" y="-35%" width="170%" height="190%">
    <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#160A05" flood-opacity=".42"/>
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity=".16"/>
  </filter>
  <filter id="groundBlur" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="softInner">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
    <feOffset dy="2" result="off"/>
    <feComposite in="off" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
    <feColorMatrix in="inner" type="matrix"
      values="0 0 0 0 0.25
              0 0 0 0 0.08
              0 0 0 0 0.02
              0 0 0 .35 0"/>
    <feComposite in2="SourceGraphic" operator="over"/>
  </filter>
  <filter id="texture">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 .055"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="steamGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="topBunClip">
    <path d="M205 408C224 218 360 126 512 126s288 92 307 282H205Z"/>
  </clipPath>
  <clipPath id="pattyClip">
    <path d="M238 486c7-46 48-80 95-80h358c47 0 88 34 95 80l7 43c5 34-22 65-57 65H288c-35 0-62-31-57-65l7-43Z"/>
  </clipPath>
</defs>

<style>
  .float{transform-box:fill-box;transform-origin:center;animation:float 4.8s cubic-bezier(.4,0,.2,1) infinite}
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 5.4s ease-in-out infinite}
  .steamA{animation:steam 3.8s ease-in-out infinite}
  .steamB{animation:steam 3.8s .9s ease-in-out infinite}
  .gleam{animation:gleam 6.2s ease-in-out infinite}
  .cheesePulse{transform-box:fill-box;transform-origin:top;animation:cheesePulse 4.2s ease-in-out infinite}
  .smile{transform-box:fill-box;transform-origin:center;animation:smile 4.8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.07)}}
  @keyframes steam{0%{opacity:0;transform:translateY(16px) scale(.92)}35%{opacity:.5}100%{opacity:0;transform:translateY(-64px) scale(1.15)}}
  @keyframes gleam{0%,18%,100%{opacity:.04;transform:translateX(-180px)}45%,56%{opacity:.62;transform:translateX(260px)}}
  @keyframes cheesePulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
  @keyframes smile{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<ellipse cx="512" cy="853" rx="294" ry="50" fill="#5A250B" opacity=".18" filter="url(#groundBlur)"/>

<g class="float" filter="url(#heroShadow)">
  <!-- Bottom bun -->
  <path d="M228 700c0 88 72 129 284 129s284-41 284-129c0-24-11-47-32-67H260c-21 20-32 43-32 67Z" fill="url(#bunBottom)" filter="url(#softInner)"/>
  <path d="M253 699c27 58 95 82 259 82s232-24 259-82c-45 25-126 40-259 40s-214-15-259-40Z" fill="#7D2E0A" opacity=".22"/>
  <path d="M279 648h466c27 0 49 19 53 45l2 12H224l2-12c4-26 26-45 53-45Z" fill="url(#bunRim)"/>
  <ellipse cx="512" cy="667" rx="190" ry="24" fill="#FFE3A2" opacity=".22"/>

  <!-- Lettuce -->
  <path d="M210 635c24-18 47-24 68-17 25 8 35 34 61 34 28 0 40-32 69-33 31-1 44 30 75 32 32 2 46-30 77-29 32 1 42 35 74 36 28 1 42-24 68-27 30-4 51 12 76 29-12 38-47 61-86 61H296c-40 0-74-24-86-63Z" fill="url(#lettuce)" filter="url(#softInner)"/>
  <path d="M240 658c66 2 105 17 149 29 53 15 95 19 154 14 71-6 122-18 176-37-15 25-44 40-76 40H299c-28 0-48-13-59-46Z" fill="#0D4B28" opacity=".25"/>
  <g fill="#DFF7B3" opacity=".45">
    <circle cx="330" cy="664" r="5"/><circle cx="676" cy="670" r="5"/><circle cx="606" cy="651" r="4"/>
  </g>

  <!-- Tomato -->
  <path d="M247 580c19-29 52-47 88-47h354c36 0 69 18 88 47l14 23H233l14-23Z" fill="url(#tomato)" filter="url(#softInner)"/>
  <path d="M289 558c88-24 358-24 446 0-16-17-40-28-66-28H355c-27 0-50 11-66 28Z" fill="#FFB09E" opacity=".3"/>
  <g fill="#FFD7B9" opacity=".38">
    <ellipse cx="365" cy="571" rx="15" ry="5"/><ellipse cx="438" cy="562" rx="13" ry="5"/>
    <ellipse cx="585" cy="563" rx="13" ry="5"/><ellipse cx="660" cy="573" rx="15" ry="5"/>
  </g>

  <!-- Patty -->
  <path d="M238 486c7-46 48-80 95-80h358c47 0 88 34 95 80l7 43c5 34-22 65-57 65H288c-35 0-62-31-57-65l7-43Z" fill="url(#patty)" filter="url(#texture)"/>
  <path d="M266 472c85 31 407 31 492 0-14-39-48-64-88-64H354c-40 0-74 25-88 64Z" fill="#A45E43" opacity=".34"/>
  <g clip-path="url(#pattyClip)" opacity=".26">
    <path d="M280 438l94 83M392 427l92 86M516 428l91 84M635 439l86 75" stroke="#D88A66" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Cheese -->
  <path d="M225 398c6-35 36-61 72-61h430c36 0 66 26 72 61l8 49-69 1-21 73-61-50-74 55-70-55-73 52-65-50-60 43-25-67-74-1 9-50Z" fill="url(#cheese)" filter="url(#softInner)"/>
  <path d="M270 371h484c-15-23-41-37-69-37H339c-28 0-54 14-69 37Z" fill="#FFF4A8" opacity=".42"/>
  <path class="cheesePulse" d="M659 433c22 0 39 17 39 39v51c0 20-16 36-36 36s-36-16-36-36v-51c0-22 14-39 33-39Z" fill="#E7900A"/>
  <path class="cheesePulse" d="M311 437c17 0 31 14 31 31v31c0 17-14 31-31 31s-31-14-31-31v-31c0-17 14-31 31-31Z" fill="#E9940D" style="animation-delay:.7s"/>

  <!-- Top bun -->
  <path d="M205 408C224 218 360 126 512 126s288 92 307 282H205Z" fill="url(#bunTop)" filter="url(#softInner)"/>
  <path d="M242 374c57-145 168-210 270-210s213 65 270 210c-72-55-168-82-270-82s-198 27-270 82Z" fill="#FFE7AA" opacity=".23"/>
  <path d="M240 403h544c13 0 24 11 24 24s-11 24-24 24H240c-13 0-24-11-24-24s11-24 24-24Z" fill="#B95814"/>
  <path d="M246 403h532c-32 20-89 34-266 34s-234-14-266-34Z" fill="#F0A13B"/>

  <!-- Sesame -->
  <g fill="#FFF4C2" stroke="#E9B85F" stroke-width="2">
    <ellipse cx="351" cy="246" rx="8" ry="17" transform="rotate(-38 351 246)"/>
    <ellipse cx="420" cy="201" rx="8" ry="16" transform="rotate(-8 420 201)"/>
    <ellipse cx="497" cy="189" rx="8" ry="16" transform="rotate(14 497 189)"/>
    <ellipse cx="577" cy="207" rx="8" ry="16" transform="rotate(-14 577 207)"/>
    <ellipse cx="653" cy="250" rx="9" ry="17" transform="rotate(35 653 250)"/>
    <ellipse cx="302" cy="316" rx="8" ry="16" transform="rotate(-55 302 316)"/>
    <ellipse cx="718" cy="321" rx="8" ry="16" transform="rotate(50 718 321)"/>
    <ellipse cx="410" cy="311" rx="8" ry="16" transform="rotate(-18 410 311)"/>
    <ellipse cx="518" cy="290" rx="8" ry="16" transform="rotate(20 518 290)"/>
    <ellipse cx="615" cy="316" rx="8" ry="16" transform="rotate(16 615 316)"/>
  </g>

  <!-- Face -->
  <g>
    <ellipse cx="420" cy="503" rx="38" ry="47" fill="url(#eye)"/>
    <ellipse cx="604" cy="503" rx="38" ry="47" fill="url(#eye)"/>
    <g class="blink">
      <ellipse cx="409" cy="486" rx="10" ry="14" fill="#fff" opacity=".92"/>
      <ellipse cx="593" cy="486" rx="10" ry="14" fill="#fff" opacity=".92"/>
      <circle cx="430" cy="514" r="5" fill="#74C9EF" opacity=".55"/>
      <circle cx="614" cy="514" r="5" fill="#74C9EF" opacity=".55"/>
    </g>
    <path d="M409 442c18-10 36-10 54 0" fill="none" stroke="#2A120E" stroke-width="10" stroke-linecap="round" opacity=".68"/>
    <path d="M561 442c18-10 36-10 54 0" fill="none" stroke="#2A120E" stroke-width="10" stroke-linecap="round" opacity=".68"/>
    <g class="smile">
      <path d="M462 548c28 29 72 29 100 0 5 31-18 57-50 57s-55-26-50-57Z" fill="url(#mouth)"/>
      <path d="M485 580c18 9 36 9 54 0-5 12-15 18-27 18s-22-6-27-18Z" fill="url(#tongue)"/>
    </g>
  </g>

  <!-- Moving highlight -->
  <g clip-path="url(#topBunClip)">
    <path class="gleam" d="M210 132h105l240 286H445L210 132Z" fill="url(#specular)"/>
  </g>
</g>

<!-- Steam -->
<g fill="none" stroke="#FFF4D6" stroke-width="12" stroke-linecap="round" opacity=".52" filter="url(#steamGlow)">
  <path class="steamA" d="M430 164c-24-31 27-47 2-88"/>
  <path class="steamB" d="M592 166c25-31-26-47 2-88"/>
</g>
</svg>